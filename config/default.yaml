parser:
  pdf_backend: "pymupdf"

chunker:
  strategy: "recursive"
  chunk_size: 2048
  chunk_overlap: 256

quality_filter:
  enabled: true
  min_quality_score: 0.3               # 0-1; chunks below this are dropped
  skip_references: true                # drop bibliography/references sections
  max_url_ratio: 0.5                   # drop chunks where URLs exceed this fraction

embedder:
  provider: "local"                    # "local" | "openai"
  model: "nomic-ai/nomic-embed-text-v1.5"
  device: "cpu"                        # "cpu" | "auto"
  dimensions: 768                      # can truncate for speed (Matryoshka)
  batch_size: 32                       # CPU: smaller batches work better

reranker:
  enabled: true
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  device: "cpu"                        # "cpu" | "auto"

retriever:
  backend: "faiss"                     # "faiss" | "numpy"
  algorithm: "flat"                    # "flat" | "hnsw" (faiss only)
  metric: "cosine"
  top_k: 5
  min_chunk_length: 128
  index_path: "/data/indexes"
  metadata_db: "/data/metadata.db"
